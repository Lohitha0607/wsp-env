[project]
name = "wsp-env"
version = "0.1.0"
description = "Weight Doctor: RL environments where an AI doctor repairs a deliberately damaged neural network by editing its weights directly, graded on held-out data."
readme = "README.md"
authors = [
    { name = "Lohitha Naidu", email = "lohitha0607@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "verifiers>=0.4.1",
]

[project.scripts]
wsp-env = "wsp_env:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["wsp_env", "wsp_llm"]
